# The make check gate on Linux, macOS and Windows. Steps are spelled out
# rather than run through make, so Windows needs no GNU make, and each runs
# even after an earlier one fails, so one run reports every gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # go.mod pins the exact Go release.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generated files match sources
        if: success() || failure()
        run: go run ./tools/plugin-compiler --check

      - name: go vet
        if: success() || failure()
        run: go vet ./...

      # Results depend on build tags, so it runs on every OS.
      - name: staticcheck
        if: success() || failure()
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      # OS-independent lints run once, on Linux.
      - name: gofmt
        if: runner.os == 'Linux' && (success() || failure())
        run: test -z "$(gofmt -l cmd internal tools)" || { gofmt -l cmd internal tools; exit 1; }

      - name: actionlint
        if: runner.os == 'Linux' && (success() || failure())
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: go test (race detector)
        if: success() || failure()
        run: go test -race ./...
